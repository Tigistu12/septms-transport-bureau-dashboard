<div class="min-h-screen bg-slate-900 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <h2 class="text-3xl font-extrabold text-white tracking-tight">SEPTMS Bureau Portal</h2>
    <p class="mt-2 text-sm text-slate-400">Sign in with your administrative or operational credentials</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-800 py-8 px-4 shadow-xl rounded-lg sm:px-10 border border-slate-700">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
        @if (errorMessage()) {
          <div class="rounded-md bg-red-900/50 p-4 border border-red-500/50">
            <p class="text-sm font-medium text-red-200">{{ errorMessage() }}</p>
          </div>
        }

        <div>
          <label class="block text-sm font-medium text-slate-200">Email Address</label>
          <div class="mt-1">
            <input formControlName="email" type="email" autocomplete="email" class="w-full rounded-md border-slate-600 bg-slate-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5 border" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200">Password</label>
          <div class="mt-1">
            <input formControlName="password" type="password" autocomplete="current-password" class="w-full rounded-md border-slate-600 bg-slate-900 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5 border" />
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="isLoading()" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
            @if (isLoading()) {
              <span>Signing in...</span>
            } @else {
              <span>Sign In</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
